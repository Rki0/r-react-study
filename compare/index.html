<!DOCTYPE html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Todo App</title>
    <style>
      body {
        font-family: sans-serif;
        padding: 20px;
      }
      input[type="text"] {
        padding: 5px;
        font-size: 16px;
      }
      button {
        margin-left: 5px;
        padding: 5px 10px;
      }
      ul {
        list-style: none;
        padding: 0;
        margin-top: 20px;
      }
      li {
        margin-bottom: 10px;
      }
    </style>
  </head>
  <body>
    <h1>Todo App</h1>
    <input type="text" id="todo-input" placeholder="Enter a todo" />
    <button id="add-button">Add</button>

    <ul id="todo-list"></ul>

    <script src="app.js"></script>
  </body>
</html>
